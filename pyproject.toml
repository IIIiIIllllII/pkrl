[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gen3rl"
version = "0.1.0"
description = "Train and export a ROM-compatible additive LUT policy for Pokémon Gen 3 battles"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "PyYAML>=6"]

[project.optional-dependencies]
train = ["torch>=2.5"]
test = ["pytest>=8"]

[project.scripts]
gen3rl = "gen3rl.cli:main"

[tool.setuptools.packages.find]
include = ["gen3rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

